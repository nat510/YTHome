[package]
name = "ythome"
version = "0.1.0"
edition = "2021"
description = "Opens m.youtube.com in a Chrome Custom Tab from a pure-native Android activity"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
